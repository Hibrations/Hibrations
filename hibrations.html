<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hibrations</title>
<link href="fonts/fonts.css" rel="stylesheet">
<link href="temple.css" rel="stylesheet">
<style>
/* Portal remake, step 8: the colours, header, sky and bottom bar come from temple.css and shell.js.
   The page's old colour names are kept as aliases of the shared tokens, so its own script and classes work unchanged.
   Gold (the accent) marks Lek's yes and nothing else: Nokka's rule. Nothing on this page posts. */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body[data-temple] {
  --bg-elev: var(--card); --bg-card: var(--card); --border: var(--leaf); --border-soft: var(--leaf2);
  --ink-dim: var(--muted); --ink-faint: var(--muted);
  --amethyst: var(--t-text); --amethyst-dim: var(--t-dim); --amethyst-faint: var(--t-faint);
  --gold: #D4A64A; --gold-dim: var(--leaf); --crimson: var(--muted);
  --joey: #D8A0AA; --sophia: #A191C7; --lineage: var(--t-text); --practice: #7FA68A;
  --r-sm: 10px; --r-md: 14px; --r-lg: 18px;
}
#tl-btn { display: none !important; }   /* the director is in the header and the bar now (director.js) */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.brand-sub { font-size: 12px; color: var(--muted); }

.northstar { margin: 0 0 14px; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; color: var(--ink); font-size: 17px; line-height: 1.35; }
.northstar:empty { display: none; }

.tabs { display: flex; gap: 6px; margin: 14px 0 16px; }
.tab { flex: 1; display: grid; place-items: center; min-height: 44px; font-size: 13px; padding: 0 4px; border-radius: 12px; border: 1px solid var(--border-soft); color: var(--ink-dim); cursor: pointer; }
.tab.active { color: var(--ink); border-color: var(--t-text); background: var(--t-faint); }
.eyebrow { font-size: 12px; letter-spacing: .04em; color: var(--muted); margin: 22px 2px 10px; }
.eyebrow:first-child { margin-top: 4px; }

.capture-box { width: 100%; min-height: 130px; resize: vertical; background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--r-md); color: var(--ink); font-family: inherit; font-size: 16px; line-height: 1.5; padding: 14px; }
.capture-box:focus { outline: none; border-color: var(--t-text); }
.capture-box::placeholder { color: var(--muted); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.chip { display: grid; place-items: center; min-height: 44px; font-size: 13px; padding: 0 14px; border-radius: 12px; cursor: pointer; border: 1px solid var(--border-soft); color: var(--ink-dim); }
.chip.on { color: var(--ink); border-color: var(--t-text); background: var(--t-faint); }
.chip.joey.on { border-color: var(--joey); color: var(--joey); }
.chip.sophia.on { border-color: var(--sophia); color: var(--sophia); }
.chip.lineage.on { border-color: var(--lineage); color: var(--lineage); }
.chip.practice.on { border-color: var(--practice); color: var(--practice); }
.btn-primary { width: 100%; min-height: 48px; padding: 0 13px; border-radius: var(--r-md); font: inherit; font-size: 14px; font-weight: 500; border: 1px solid var(--t-btn); background: var(--t-btn); color: var(--on-btn); cursor: pointer; margin-top: 4px; }
.hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; font-style: italic; }

.tuning { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 16px; background: var(--bg-elev); border: 1px solid var(--border-soft); border-radius: var(--r-md); }
.tuning-icon { font-size: 20px; }
.tuning-text { font-size: 13px; color: var(--ink-dim); font-style: italic; }

.stage-group { margin-bottom: 8px; }
.stage-head { display: flex; align-items: baseline; gap: 8px; margin: 18px 2px 9px; }
.stage-name { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 19px; color: var(--ink); }
.stage-count { display: none; }   /* no counts on this page (Nokka) */
.piece { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 9px; cursor: pointer; min-height: 56px; }
.piece.integration { border-color: var(--leaf); }
.piece-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
.piece-title.untitled { color: var(--muted); font-weight: 400; font-style: italic; }
.piece-excerpt { font-size: 13px; color: var(--ink-dim); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.piece-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tag-pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border-soft); color: var(--ink-dim); }
.tag-pill.joey { color: var(--joey); border-color: var(--joey); }
.tag-pill.sophia { color: var(--sophia); border-color: var(--sophia); }
.tag-pill.lineage { color: var(--lineage); border-color: var(--lineage); }
.tag-pill.practice { color: var(--practice); border-color: var(--practice); }
.integration-mark { font-size: 12px; color: var(--t2-text); display: inline-flex; align-items: center; gap: 4px; }
.piece-track { font-size: 12px; color: var(--muted); margin-top: 7px; }
.piece-chakras { letter-spacing: 2px; margin-top: 6px; font-size: 13px; }
.empty-line { font-size: 13px; color: var(--muted); font-style: italic; padding: 6px 2px; }

.overlay { position: fixed; inset: 0; background: var(--bg); z-index: 50; overflow-y: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(var(--ts-bar) + 40px + env(safe-area-inset-bottom, 0px)); max-width: 640px; margin: 0 auto; }
.overlay[hidden] { display: none; }
.detail-input { width: 100%; min-height: 44px; background: transparent; border: none; color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 25px; font-weight: 600; padding: 6px 0; margin-bottom: 4px; }
.detail-input:focus { outline: none; }
.detail-input::placeholder { color: var(--muted); font-weight: 400; }
.detail-body { width: 100%; min-height: 200px; resize: vertical; background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--r-md); color: var(--ink); font-family: inherit; font-size: 16px; line-height: 1.6; padding: 13px; margin: 8px 0 4px; }
.detail-body:focus { outline: none; border-color: var(--t-text); }
.field-label { font-size: 12px; letter-spacing: .04em; color: var(--muted); margin: 20px 2px 9px; }
.track-row { display: flex; gap: 8px; }
.track-input { flex: 1; min-width: 0; min-height: 44px; background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--r-sm); color: var(--ink); font-family: inherit; font-size: 16px; padding: 0 12px; }
.track-input:focus { outline: none; border-color: var(--t-text); }
.track-input::placeholder { color: var(--muted); }
.chakra-palette { display: flex; flex-wrap: wrap; gap: 6px; }
.chakra-btn { font-size: 18px; width: 44px; height: 44px; border-radius: var(--r-sm); cursor: pointer; border: 1px solid var(--border-soft); background: var(--bg-card); opacity: 0.45; display: flex; align-items: center; justify-content: center; }
.chakra-btn.on { opacity: 1; border-color: var(--t-text); background: var(--t-faint); }
.stage-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.stage-pill { display: grid; place-items: center; min-height: 44px; font-size: 13px; padding: 0 14px; border-radius: 12px; cursor: pointer; border: 1px solid var(--border-soft); color: var(--ink-dim); }
.stage-pill.on { color: var(--ink); border-color: var(--t-text); background: var(--t-faint); }
.artboy { margin: 20px 0 4px; min-height: 48px; padding: 13px 15px; border: 1px dashed var(--leaf); border-radius: var(--r-md); cursor: pointer; }
.artboy-q { font-size: 14px; color: var(--t2-text); font-weight: 500; }
.artboy-body { font-size: 13px; color: var(--ink-dim); font-style: italic; margin-top: 8px; display: none; }
.artboy.open .artboy-body { display: block; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.btn-ship { flex: 1; min-height: 48px; padding: 0 13px; border-radius: var(--r-md); font: inherit; font-size: 14px; font-weight: 500; border: 1px solid var(--gold); background: none; color: var(--gold); cursor: pointer; }
.btn-ship[disabled] { opacity: 0.35; cursor: default; }
.btn-del { min-height: 48px; padding: 0 16px; border-radius: var(--r-md); font: inherit; font-size: 13px; border: 1px solid var(--border-soft); background: none; color: var(--muted); cursor: pointer; }
.detail-back { min-height: 44px; font: inherit; font-size: 13px; color: var(--ink); background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px; padding: 0 16px; cursor: pointer; }
.detail-stamp { font-size: 12px; color: var(--muted); margin-top: 18px; text-align: center; }

.shipped-head { display: none; }   /* a count of posts: left out (Nokka: no post counts) */
.shipped-piece { background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--r-md); padding: 13px 15px; margin-bottom: 10px; }
.shipped-title { font-size: 15px; font-weight: 600; color: var(--ink); }
.shipped-date { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* step 8: Nokka's draft shelf, four drawers; copy, never post */
.hb-shelf { margin-top: 22px; }
.hb-shelf .ts-pills { margin: 10px 0 4px; }
.hb-shelf .ts-pills button { flex: 1; min-width: 0; padding: 0 4px; }
.hb-draft { padding: 12px 0; border-top: 1px solid var(--leaf2); }
.hb-draft.hb-yes { border-top-color: #D4A64A; }
.hb-first { display: block; width: 100%; min-height: 44px; text-align: left; font: inherit; font-size: 15px; color: var(--ink); background: none; border: none; padding: 0; cursor: pointer; }
.hb-first small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.hb-text { font-size: 14px; line-height: 1.55; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; }
.hb-text[hidden] { display: none; }
.hb-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.hb-acts button { flex: 1; min-height: 44px; font: inherit; font-size: 13px; color: var(--ink); background: none; border: 1px solid var(--leaf2); border-radius: 12px; padding: 0 8px; cursor: pointer; }
.hb-acts button.hb-on { border-color: var(--t-text); background: var(--t-faint); }
.hb-none { font-size: 13px; color: var(--muted); padding: 10px 0 2px; }
.hb-copy { min-height: 48px; padding: 0 16px; border-radius: 14px; font: inherit; font-size: 13px; border: 1px solid var(--leaf); background: none; color: var(--ink); cursor: pointer; }

.toast { position: fixed; left: 50%; bottom: calc(var(--ts-bar) + 24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: 90vw; background: var(--card); border: 1px solid var(--leaf); color: var(--ink); padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 880; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
<script src="shell.js"></script>
<script src="temple_link.js" data-app="hibrations"></script>
</head>
<body data-temple="hibrations">
<header class="ts-head">
  <div class="ts-hrow">
    <button class="ts-back" id="back-btn" type="button" aria-label="Back">←</button>
    <div class="ts-tt"><b>Hibrations</b><span>Artboy · the voice · the work</span></div>
  </div>
</header>
<main class="ts-body" id="main">
  <div class="northstar" id="northstar"></div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="capture">capture</div>
    <div class="tab" data-tab="desk">the desk</div>
    <div class="tab" data-tab="shipped">shipped</div>
  </div>

  <div id="view"></div>

  <section class="ts-card hb-shelf" id="hb-shelf">
    <div class="ts-eyebrow">Nokka's draft shelf</div>
    <div class="ts-pills" id="hb-drawers" role="tablist"></div>
    <div id="hb-list"></div>
    <p class="hb-none">Copy takes a draft to your clipboard. Nothing here posts.</p>
  </section>
</main>

<div class="overlay" id="detail" hidden></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var STAGES = ['seed', 'shaping', 'drafting', 'ready'];
  var STAGE_LABELS = { seed: 'seeds', shaping: 'shaping', drafting: 'drafting', ready: 'ready', shipped: 'shipped' };
  var STAGE_HINT = {
    seed: 'the raw download — caught before it dissolved',
    shaping: 'Joey gave it to you; now it finds its shape',
    drafting: 'in the words — music on, notebook open',
    ready: 'polished. waiting for the moment to appear'
  };
  var TAGS = [
    { id: 'joey', label: 'Joey' },
    { id: 'sophia', label: 'Sophia' },
    { id: 'lineage', label: 'lineage' },
    { id: 'practice', label: 'practice' }
  ];
  var MEDIUMS = ['post', 'song', 'line', 'thread', 'voice note'];
  var CHAKRAS = [
    { e: '🔴', m: 'root · romance · the primal' },
    { e: '🧡', m: 'sacral · creativity · sexuality' },
    { e: '💛', m: 'solar plexus · confidence · joy' },
    { e: '💚', m: 'heart · Hibrations · unconditional love' },
    { e: '💙', m: 'throat · truth · communication' },
    { e: '💜', m: 'third eye · intuition · insight' },
    { e: '🤍', m: 'crown · the divine' },
    { e: '🖤', m: 'darkness · heavy · honest' },
    { e: '🩷', m: 'soft love · warmth' }
  ];
  var NORTHSTARS = [
    'Just trying to find my purpose..',
    'Det er nemlig igennem mine passions jeg fandt medicinen.',
    'You make me feel less alone.',
    'Just because someone carries it well — doesn’t mean it’s not heavy.',
    'I’m so proud of how I lived.',
    'Deler efter bearbejdelse.',
    'The pain was the price. And the price was fair.'
  ];
  var ARTBOY_PROMPTS = [
    'What would Artboy say — the soft-hearted puppy that growls and shows teeth when needed?',
    'Drop the disclaimer. Say the thing you’re learning to say without it.',
    'Shield down, nervous system regulated, the music playing. Now write it again.',
    'Not the therapist. The friend who’s been there. What does he tell them?',
    'Less fucks given. More heart shown. What’s the line underneath the line?'
  ];

  // ---------- state ----------
  var KEY = 'hibrations_v1';
  var state = load();
  var currentTab = state.lastTab || 'capture';
  var editingId = null;
  var captureDraft = { text: '', tags: [], medium: '' };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var p = JSON.parse(raw); if (!p.pieces) p.pieces = []; return p; }
    } catch (e) {}
    return { pieces: [], lastTab: 'capture' };
  }
  function save() {
    state.lastTab = currentTab;
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function uid() { return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // ---------- helpers ----------
  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  function esc(s) {
    return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function isIntegration(p) { return p.tags && p.tags.indexOf('joey') > -1 && p.tags.indexOf('sophia') > -1; }
  function relDate(ts) {
    if (!ts) return '';
    var diff = Date.now() - ts, day = 864e5;
    if (diff < day && new Date(ts).getDate() === new Date().getDate()) return 'today';
    var d = Math.floor(diff / day);
    if (d <= 1) return 'yesterday';
    if (d < 7) return d + 'd ago';
    if (d < 14) return '1 week ago';
    if (d < 60) return Math.floor(d / 7) + ' weeks ago';
    return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1700);
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  // ---------- north star ----------
  function setNorthstar() {
    var i = Math.floor(Date.now() / 864e5) % NORTHSTARS.length;
    document.getElementById('northstar').textContent = NORTHSTARS[i];
  }

  // ---------- render router ----------
  function render() {
    var view = document.getElementById('view');
    view.innerHTML = '';
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.tab === currentTab);
    });
    if (currentTab === 'capture') renderCapture(view);
    else if (currentTab === 'desk') renderDesk(view);
    else renderShipped(view);
    window.scrollTo(0, 0);
  }

  // ---------- capture ----------
  function renderCapture(view) {
    view.appendChild(el('div', 'eyebrow', 'catch it in the first ninety seconds'));

    var box = el('textarea', 'capture-box');
    box.id = 'cap-text';
    box.placeholder = 'what wants to be said?';
    box.value = captureDraft.text;
    box.addEventListener('input', function () { captureDraft.text = box.value; });
    view.appendChild(box);

    var medRow = el('div', 'chip-row');
    MEDIUMS.forEach(function (m) {
      var c = el('div', 'chip' + (captureDraft.medium === m ? ' on' : ''), esc(m));
      c.addEventListener('click', function () {
        captureDraft.medium = (captureDraft.medium === m ? '' : m);
        renderCapture(view);
      });
      medRow.appendChild(c);
    });
    view.appendChild(medRow);

    var tagRow = el('div', 'chip-row');
    TAGS.forEach(function (t) {
      var on = captureDraft.tags.indexOf(t.id) > -1;
      var c = el('div', 'chip ' + t.id + (on ? ' on' : ''), esc(t.label));
      c.addEventListener('click', function () {
        var i = captureDraft.tags.indexOf(t.id);
        if (i > -1) captureDraft.tags.splice(i, 1); else captureDraft.tags.push(t.id);
        renderCapture(view);
      });
      tagRow.appendChild(c);
    });
    view.appendChild(tagRow);

    var btn = el('button', 'btn-primary', 'catch it');
    btn.addEventListener('click', function () {
      var text = (captureDraft.text || '').trim();
      if (!text) { toast('nothing to catch yet'); return; }
      var p = {
        id: uid(), title: '', body: text, stage: 'seed',
        tags: captureDraft.tags.slice(), chakras: [],
        track: { song: '', artist: '' }, medium: captureDraft.medium,
        createdAt: Date.now(), updatedAt: Date.now(), shippedAt: null
      };
      state.pieces.unshift(p);
      save();
      captureDraft = { text: '', tags: [], medium: '' };
      buzz(20);
      toast('caught — it’s on the desk');
      renderCapture(view);
    });
    view.appendChild(btn);
    view.appendChild(el('div', 'hint', 'most songs die because you didn’t catch them in the first ninety seconds'));

    // recent seeds
    var seeds = state.pieces.filter(function (p) { return p.stage === 'seed'; }).slice(0, 5);
    if (seeds.length) {
      view.appendChild(el('div', 'eyebrow', 'still raw'));
      seeds.forEach(function (p) { view.appendChild(pieceCard(p)); });
    }
  }

  // ---------- desk ----------
  function renderDesk(view) {
    var tune = el('div', 'tuning');
    tune.appendChild(el('span', 'tuning-icon', '🎧'));
    tune.appendChild(el('span', 'tuning-text', 'music first — the tuning ritual. drop into ventral vagal before the channel opens.'));
    view.appendChild(tune);

    var active = state.pieces.filter(function (p) { return p.stage !== 'shipped'; });
    if (!active.length) {
      view.appendChild(el('div', 'empty-line', 'the desk is clear. catch something on the capture tab.'));
      return;
    }
    STAGES.forEach(function (stage) {
      var group = active.filter(function (p) { return p.stage === stage; });
      if (!group.length) return;
      var head = el('div', 'stage-head');
      head.appendChild(el('span', 'stage-name', STAGE_LABELS[stage]));
      head.appendChild(el('span', 'stage-count', group.length));
      view.appendChild(head);
      group.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
      group.forEach(function (p) { view.appendChild(pieceCard(p)); });
    });
  }

  function pieceCard(p) {
    var card = el('div', 'piece' + (isIntegration(p) ? ' integration' : ''));
    var title = (p.title || '').trim();
    if (title) card.appendChild(el('div', 'piece-title', esc(title)));
    else card.appendChild(el('div', 'piece-title untitled', esc(excerptOf(p.body, 40)) || 'untitled'));
    if (title && p.body) card.appendChild(el('div', 'piece-excerpt', esc(excerptOf(p.body, 120))));

    var meta = el('div', 'piece-meta');
    if (isIntegration(p)) {
      meta.appendChild(el('span', 'integration-mark', '◈ integration'));
    }
    (p.tags || []).forEach(function (t) {
      if (isIntegration(p) && (t === 'joey' || t === 'sophia')) return;
      meta.appendChild(el('span', 'tag-pill ' + t, esc(t)));
    });
    if (p.medium) meta.appendChild(el('span', 'tag-pill', esc(p.medium)));
    card.appendChild(meta);

    if (p.chakras && p.chakras.length) {
      card.appendChild(el('div', 'piece-chakras', p.chakras.join(' ')));
    }
    if (p.track && p.track.song) {
      card.appendChild(el('div', 'piece-track', '♪ ' + esc(p.track.song) + (p.track.artist ? ' — ' + esc(p.track.artist) : '')));
    }
    card.addEventListener('click', function () { openDetail(p.id); });
    return card;
  }

  function excerptOf(body, n) {
    var s = (body || '').replace(/\s+/g, ' ').trim();
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  }

  // ---------- shipped ----------
  function renderShipped(view) {
    var shipped = state.pieces.filter(function (p) { return p.stage === 'shipped'; });
    shipped.sort(function (a, b) { return (b.shippedAt || 0) - (a.shippedAt || 0); });

    var head = el('div', 'shipped-head');
    head.appendChild(el('div', 'shipped-count', shipped.length));
    head.appendChild(el('div', 'shipped-label', shipped.length === 1 ? 'piece made visible' : 'pieces made visible'));
    view.appendChild(head);

    if (!shipped.length) {
      view.appendChild(el('div', 'empty-line', 'nothing shipped yet. the question is no longer if — it’s how deeply you’re willing to be seen.'));
      return;
    }
    shipped.forEach(function (p) {
      var card = el('div', 'shipped-piece' + (isIntegration(p) ? ' integration' : ''));
      var title = (p.title || '').trim() || excerptOf(p.body, 40) || 'untitled';
      card.appendChild(el('div', 'shipped-title', esc(title)));
      if (p.track && p.track.song) card.appendChild(el('div', 'piece-track', '♪ ' + esc(p.track.song) + (p.track.artist ? ' — ' + esc(p.track.artist) : '')));
      if (p.chakras && p.chakras.length) card.appendChild(el('div', 'piece-chakras', p.chakras.join(' ')));
      card.appendChild(el('div', 'shipped-date', 'shipped ' + relDate(p.shippedAt)));
      card.addEventListener('click', function () { openDetail(p.id); });
      view.appendChild(card);
    });
  }

  // ---------- detail ----------
  function findPiece(id) {
    for (var i = 0; i < state.pieces.length; i++) if (state.pieces[i].id === id) return state.pieces[i];
    return null;
  }

  function openDetail(id) {
    var p = findPiece(id);
    if (!p) return;
    editingId = id;
    var d = document.getElementById('detail');
    d.innerHTML = '';
    d.hidden = false;
    document.body.style.overflow = 'hidden';

    var bar = el('div', 'topbar');
    var back = el('button', 'detail-back', '← the desk');
    back.addEventListener('click', closeDetail);
    bar.appendChild(back);
    bar.appendChild(el('div', 'brand-sub', isIntegration(p) ? '◈ integration — both flames' : 'a piece in progress'));
    d.appendChild(bar);

    var titleI = el('input', 'detail-input');
    titleI.placeholder = 'title (optional)';
    titleI.value = p.title || '';
    titleI.addEventListener('input', function () { p.title = titleI.value; touch(p); });
    d.appendChild(titleI);

    var bodyT = el('textarea', 'detail-body');
    bodyT.value = p.body || '';
    bodyT.addEventListener('input', function () { p.body = bodyT.value; touch(p); });
    d.appendChild(bodyT);

    // the temple link (Lysningen step 8): why this version, its earlier versions, and the button
    if (p.by && p.linkWhy) d.appendChild(el('div', 'hint', esc(p.by) + ': ' + esc(p.linkWhy)));
    if (window.TempleLink) d.appendChild(TempleLink.linkTo({ kind: 'piece', id: p.id, name: (p.title || 'this piece').slice(0, 80) }));
    (p.versions || []).slice().reverse().forEach(function (v, ri) {
      var idx = p.versions.length - 1 - ri;
      var row = el('div', 'hint', (v.by && v.by !== 'Lek' ? esc(v.by) + '’s' : 'your') + ' version · ' + esc((v.at || '').slice(0, 10)) + ' ');
      var sw = el('button', 'detail-back', 'switch back');
      sw.addEventListener('click', function () {
        var now = { title: p.title || '', body: p.body || '', by: p.by || 'Lek', at: new Date().toISOString() };
        p.title = v.title || ''; p.body = v.body || ''; p.by = v.was || undefined; p.linkWhy = undefined;
        p.versions = p.versions.filter(function (_, i) { return i !== idx; }).concat(now).slice(-20);
        touch(p); toast('switched back'); openDetail(p.id);
      });
      row.appendChild(sw);
      d.appendChild(row);
    });

    // stage
    d.appendChild(el('div', 'field-label', 'stage'));
    var stageWrap = el('div', 'stage-pills');
    STAGES.forEach(function (s) {
      var pill = el('div', 'stage-pill' + (p.stage === s ? ' on' : ''), STAGE_LABELS[s]);
      pill.addEventListener('click', function () {
        p.stage = s; touch(p); buzz(15);
        openDetail(id);
      });
      stageWrap.appendChild(pill);
    });
    d.appendChild(stageWrap);
    if (STAGE_HINT[p.stage]) d.appendChild(el('div', 'hint', STAGE_HINT[p.stage]));

    // tags
    d.appendChild(el('div', 'field-label', 'voice — who’s speaking'));
    var tagWrap = el('div', 'chip-row');
    TAGS.forEach(function (t) {
      var on = (p.tags || []).indexOf(t.id) > -1;
      var c = el('div', 'chip ' + t.id + (on ? ' on' : ''), esc(t.label));
      c.addEventListener('click', function () {
        if (!p.tags) p.tags = [];
        var i = p.tags.indexOf(t.id);
        if (i > -1) p.tags.splice(i, 1); else p.tags.push(t.id);
        touch(p); openDetail(id);
      });
      tagWrap.appendChild(c);
    });
    d.appendChild(tagWrap);

    // chakra/emoji language
    d.appendChild(el('div', 'field-label', 'chakra language — the secondary text'));
    var pal = el('div', 'chakra-palette');
    CHAKRAS.forEach(function (ch) {
      var on = (p.chakras || []).indexOf(ch.e) > -1;
      var b = el('div', 'chakra-btn' + (on ? ' on' : ''), ch.e);
      b.title = ch.m;
      b.addEventListener('click', function () {
        if (!p.chakras) p.chakras = [];
        var i = p.chakras.indexOf(ch.e);
        if (i > -1) p.chakras.splice(i, 1); else p.chakras.push(ch.e);
        touch(p); openDetail(id);
      });
      pal.appendChild(b);
    });
    d.appendChild(pal);

    // track / tuning
    d.appendChild(el('div', 'field-label', 'paired track — music as primary text'));
    var tr = el('div', 'track-row');
    var song = el('input', 'track-input'); song.placeholder = 'song';
    song.value = (p.track && p.track.song) || '';
    var artist = el('input', 'track-input'); artist.placeholder = 'artist';
    artist.value = (p.track && p.track.artist) || '';
    song.addEventListener('input', function () { if (!p.track) p.track = {}; p.track.song = song.value; touch(p); });
    artist.addEventListener('input', function () { if (!p.track) p.track = {}; p.track.artist = artist.value; touch(p); });
    tr.appendChild(song); tr.appendChild(artist);
    d.appendChild(tr);

    // artboy unlock
    var ab = el('div', 'artboy');
    var promptI = Math.floor(Date.now() / 36e5) % ARTBOY_PROMPTS.length;
    ab.appendChild(el('div', 'artboy-q', 'What would Artboy say?'));
    ab.appendChild(el('div', 'artboy-body', ARTBOY_PROMPTS[promptI]));
    ab.addEventListener('click', function () { ab.classList.toggle('open'); });
    d.appendChild(ab);

    // actions
    var actions = el('div', 'detail-actions');
    var ship = el('button', 'btn-ship', p.stage === 'shipped' ? 'unship — back to ready' : 'ship it — make it visible');
    ship.addEventListener('click', function () {
      if (p.stage === 'shipped') { p.stage = 'ready'; p.shippedAt = null; toast('back on the desk'); }
      else { p.stage = 'shipped'; p.shippedAt = Date.now(); buzz([30, 40, 60]); toast('◈ shipped — you are no longer invisible'); }
      touch(p); closeDetail();
    });
    actions.appendChild(ship);
    var del = el('button', 'btn-del', 'delete');
    del.addEventListener('click', function () {
      if (confirm('Delete this piece? This can’t be undone.')) {
        state.pieces = state.pieces.filter(function (x) { return x.id !== id; });
        save(); closeDetail();
      }
    });
    actions.appendChild(del);
    d.appendChild(actions);

    d.appendChild(el('div', 'detail-stamp', 'caught ' + relDate(p.createdAt) + (p.updatedAt && p.updatedAt !== p.createdAt ? ' · touched ' + relDate(p.updatedAt) : '')));
  }

  function touch(p) { p.updatedAt = Date.now(); save(); }

  function closeDetail() {
    var d = document.getElementById('detail');
    d.hidden = true; d.innerHTML = '';
    document.body.style.overflow = '';
    editingId = null;
    render();
  }

  // ---------- tabs + boot ----------
  document.getElementById('tabs').addEventListener('click', function (e) {
    var t = e.target.closest('.tab');
    if (!t) return;
    currentTab = t.dataset.tab; save(); render();
  });

  document.getElementById('back-btn').addEventListener('click', function () {
    try { window.parent.postMessage('close-temple', '*'); } catch (e) {}
    try { window.location.href = 'index.html'; } catch (e) {}
  });

  // Lands a proposal the director's card got a yes for: a new version with the old one kept, or a separate piece if Lek
  // changed his since the director looked. Read-merge-write, never on an empty or broken store, never twice. It never
  // moves a piece's stage: only Lek ships.
  window.templeLinkHost = {
    busy: function () { return !!editingId; },
    refresh: function () { render(); },
    land: function (x) {
      var raw = localStorage.getItem(KEY);
      if (!raw) return 'wait';
      var fresh; try { fresh = JSON.parse(raw); } catch (e) { return 'wait'; }
      if (!fresh || !Array.isArray(fresh.pieces)) return 'wait';
      if (x.kind !== 'piece') return null;
      fresh.linkLanded = fresh.linkLanded || {};
      if (fresh.linkLanded[x.id]) return { how: fresh.linkLanded[x.id], name: '' };
      var s = function (v, n) { return typeof v === 'string' ? v.trim().slice(0, n) : ''; };
      var it = x.item || {}, body = s(it.body, 12000), title = s(it.title, 160);
      if (!body) return null;
      var by = s(x.by, 30) || 'Nokka', now = new Date().toISOString(), why = s(x.why, 500), cur = null, out;
      for (var i = 0; i < fresh.pieces.length; i++) if (fresh.pieces[i].id === x.targetId) cur = fresh.pieces[i];
      if (cur && x.base && TempleLink.pieceHash(cur) === x.base) {
        cur.versions = (cur.versions || []).concat({ title: cur.title || '', body: cur.body || '', by: cur.by || 'Lek', was: cur.by || undefined, at: now }).slice(-20);
        cur.title = title; cur.body = body; cur.by = by; cur.linkWhy = why; cur.updatedAt = Date.now();
        out = { how: 'version', name: title || 'a piece' };
      } else {
        var nm = cur && title === (cur.title || '') ? (title ? title + ' · ' + by : by + '’s version') : title;
        fresh.pieces.unshift({ id: uid(), title: nm, body: body, stage: 'seed', tags: [], chakras: [], track: { song: '', artist: '' }, medium: '', createdAt: Date.now(), updatedAt: Date.now(), shippedAt: null, by: by, linkWhy: why });
        out = { how: 'new', name: nm || 'a piece' };
      }
      fresh.linkLanded[x.id] = out.how;
      state = fresh; save();
      toast('from ' + by + ': on the desk');
      return out;
    }
  };
  // another window wrote the store (this temple open twice): follow it, never overwrite it
  window.addEventListener('storage', function (e) { if (e.key === KEY && e.newValue && !editingId) { state = load(); render(); } });

  setNorthstar();
  render();
})();
</script>

<script>
// Portal remake, step 8 · Nokka's asks, beside the page's own script (unchanged above).
//   the draft shelf, four drawers: drafted, seen, yes, let go. It shows what Nokka has left: the shelf items in
//     link_hibrations_v1 and the pieces on the desk that carry her name (both read only). Which drawer a draft is
//     in lives in a store of its own, hibrations_shelf_v1 { status: { <key>: 'seen' | 'yes' | 'let go' } }; a draft
//     with no entry is "drafted". No counts on the drawers.
//   a copy button on each draft, and on an open piece. There is no post button and no network call: Lek pastes.
(function () {
  'use strict';
  var KEY = 'hibrations_shelf_v1', DRAWERS = ['drafted', 'seen', 'yes', 'let go'], drawer = 'drafted', openKey = null;
  var $ = function (id) { return document.getElementById(id); };
  function read(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function el(t, c, txt) { var n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; }
  function status() { var o = read(KEY, {}); return o && o.status && typeof o.status === 'object' ? o.status : {}; }
  function setStatus(k, v) {
    var o = read(KEY, {}); if (!o || typeof o !== 'object' || Array.isArray(o)) o = {};
    if (!o.status || typeof o.status !== 'object') o.status = {};
    if (v === 'drafted') delete o.status[k]; else o.status[k] = v;
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }
  function drafts() {
    var out = [], link = read('link_hibrations_v1', {}), st = read('hibrations_v1', {});
    (Array.isArray(link.shelf) ? link.shelf : []).forEach(function (i) {
      if (i && i.id && typeof i.text === 'string') out.push({ key: 's:' + i.id, title: i.title || '', text: i.text, by: i.by || 'Nokka' });
    });
    (Array.isArray(st.pieces) ? st.pieces : []).forEach(function (p) {
      if (p && p.id && p.by && p.by !== 'Lek' && p.stage !== 'shipped') out.push({ key: 'p:' + p.id, title: p.title || '', text: p.body || '', by: p.by });
    });
    return out.reverse();
  }
  function firstLine(d) { var l = (d.text || '').split('\n').filter(function (x) { return x.trim(); })[0] || d.title || 'a draft'; return l.length > 90 ? l.slice(0, 88) + '…' : l; }
  function say(m) { var t = $('toast'); if (!t) return; t.textContent = m; t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 1600); }
  function copy(text) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove();
      say(ok ? 'Copied. Paste it where you want it.' : 'Could not copy here. Select the text and copy it by hand.');
    }
    try { navigator.clipboard.writeText(text).then(function () { say('Copied. Paste it where you want it.'); }, fallback); } catch (e) { fallback(); }
  }

  function paint() {
    var bar = $('hb-drawers'), list = $('hb-list'), st = status(), all = drafts();
    bar.textContent = ''; list.textContent = '';
    DRAWERS.forEach(function (d) {
      var b = el('button', d === drawer ? 'ts-on' : '', d); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', d === drawer ? 'true' : 'false');
      b.addEventListener('click', function () { drawer = d; openKey = null; paint(); });
      bar.appendChild(b);
    });
    var here = all.filter(function (d) { return (st[d.key] || 'drafted') === drawer; });
    if (!here.length) {
      list.appendChild(el('p', 'hb-none', !all.length ? 'Nothing drafted. Nothing drafts unless you pull it.' : 'This drawer is empty.'));
      return;
    }
    here.forEach(function (d) {
      var row = el('div', 'hb-draft' + (drawer === 'yes' ? ' hb-yes' : '')), first = el('button', 'hb-first', firstLine(d)), body = el('p', 'hb-text', d.text), acts = el('div', 'hb-acts');
      first.type = 'button'; first.appendChild(el('small', '', d.by + (d.title ? ' · ' + d.title : '')));
      body.hidden = openKey !== d.key;
      first.addEventListener('click', function () {
        openKey = openKey === d.key ? null : d.key;
        if (openKey && (st[d.key] || 'drafted') === 'drafted') { setStatus(d.key, 'seen'); say('Moved to seen.'); }
        paint();
      });
      var c = el('button', '', 'Copy'); c.type = 'button'; c.addEventListener('click', function () { copy(d.text); });
      acts.appendChild(c);
      [['yes', 'Yes'], ['let go', 'Let go']].forEach(function (p) {
        var b = el('button', drawer === p[0] ? 'hb-on' : '', drawer === p[0] ? 'Back to seen' : p[1]); b.type = 'button';
        b.addEventListener('click', function () { setStatus(d.key, drawer === p[0] ? 'seen' : p[0]); openKey = null; paint(); });
        acts.appendChild(b);
      });
      row.appendChild(first); row.appendChild(body); row.appendChild(acts); list.appendChild(row);
    });
  }
  paint();
  try { new MutationObserver(paint).observe($('view'), { childList: true }); } catch (e) {}
  window.addEventListener('storage', function (e) { if (e.key === 'link_hibrations_v1' || e.key === KEY) paint(); });

  // a copy button on an open piece: the title and the body, as they stand in the two fields
  try {
    new MutationObserver(function () {
      var d = $('detail'), acts = d.querySelector('.detail-actions');
      if (!acts || acts.querySelector('.hb-copy')) return;
      var b = el('button', 'hb-copy', 'Copy'); b.type = 'button';
      b.addEventListener('click', function () {
        var t = d.querySelector('.detail-input'), bd = d.querySelector('.detail-body');
        copy(((t && t.value.trim()) ? t.value.trim() + '\n\n' : '') + (bd ? bd.value : ''));
      });
      acts.insertBefore(b, acts.firstChild);
    }).observe($('detail'), { childList: true });
  } catch (e) {}
})();
</script>
</body>
